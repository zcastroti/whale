<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale</title>    
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="ico-whale.png" type="image/x-icon">
</head>
<body>
    <main class="conteudo">

        <div class="bloco">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <h1>Bem-vindo ao Whale!</h1>
                    <p>Controle suas anotações e despesas!</p>
                </div>
                <img src="ico-whale.png" width="100px">
            </div>
        </div>

        <div class="bloco">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; flex-flow: column;">
                    <h1>Dólar Hoje</h1>
                    <p id="data-atualizacao"></p>
                </div> 
                <span id="valor-dolar" style="font-size: 20px;"></span>
            </div>
            
        </div>



        <div class="botoesFooter">
            <button class="btnEncerrarSessao">Encerrar Sessão <i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </main>



    <!-- Carregar Dólar -->
    <script>
    async function buscarCotacaoDolar() {
        try {
            // Requisição para a API gratuita da AwesomeAPI
            const resposta = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL');
            const dados = await resposta.json();
            
            // Acessa os dados do Dólar para Real
            const dolar = dados.USDBRL;
            const valorBid = parseFloat(dolar.bid).toFixed(2); // Valor atual de compra
            const dataFormatada = dolar.create_date; // 2026-10-26 19:30:15
            
            let dia = dataFormatada.slice(8,10)
            let mes = dataFormatada.slice(5,7)
            let ano = dataFormatada.slice(0,4)
            let hora = dataFormatada.slice(11,13)
            let minuto = dataFormatada.slice(14,16)

            let dataFinal = `${dia}/${mes}/${ano} às ${hora}:${minuto}`

            // Formata o valor para o padrão brasileiro (troca ponto por vírgula)
            const valorFormatado = `R$ ${valorBid.replace('.', ',')}`;

            // Insere os dados nos elementos HTML
            document.getElementById('valor-dolar').innerText = valorFormatado;
            document.getElementById('data-atualizacao').innerText = `Atualizado em ${dataFinal}`;
        } catch (erro) {
            console.error('Erro ao buscar cotação:', erro);
            alerta('Erro ao carregar valor do dólar!')
        }
    }

    // Chama a função assim que a página carrega
    buscarCotacaoDolar();
    </script>

    <script src="bloqueio.js"></script>
    <script type="module" src="home.js"></script>
    <script src="https://kit.fontawesome.com/ac3bdc8044.js" crossorigin="anonymous"></script>
</body>
</html>
