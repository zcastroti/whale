<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale</title>    
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="ico-whale.png" type="image/x-icon">
</head>
<body>
    <main class="conteudo">
        <div class="categoriaNotas">
        </div>

        <div class="menuNotas">
            Carregando...
        </div>

        <div class="botoesFooter">
            <button class="btnAdicionarNota">Adicionar Nota <i class="fa-solid fa-circle-plus"></i></button>
            <button class="btnConfigCategoria">Categoria de Notas<i class="fa-solid fa-gear"></i></button>
        </div>
    </main>

    <style>
        .categoriaNotas {
            max-width: 600px;
            margin: 0 auto 20px auto;
            display: flex; flex-flow: row wrap; gap: 15px;
            justify-content: center; align-items: center; }

        .categoria { 
            cursor: pointer;
            padding: 8px 16px;
            background: #f8fafc;
            border-radius: 3px;
            border: 1px solid #e2e8f0; 
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px #0000000d, 0 2px 4px -1px #00000008; }

        .categoria:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #0f172a;
            transform: translateY(-1px); }

        .categoriaAtiva {
            background: #94a3b8;
            color: #ffffff;
            border-color: #6980ab; }

        .menuNotas {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 10px; 
            padding-bottom: 120px; }

        @media screen and (max-width: 680px) { 
            .menuNotas { grid-template-columns: repeat(3, 1fr); } 
            .categoriaNotas { max-width: 450px; }
            .botoes { flex-wrap: wrap; }
        }

        .nota {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e2e8f0; 
            box-shadow: 0 4px 6px -1px #0000000d, 0 2px 4px -1px #00000008; 
            transition: all 0.2s ease-in-out; }

        .nota:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
            border-color: #cbd5e1;
            box-shadow: 0 10px 15px -3px #00000014, 0 4px 6px -2px #0000000a; }

        .editor {
            background: #e9f0f9;
            border: solid 1px #cccccc;
            overflow: hidden;
            overflow-y: scroll;
            height: 350px;
            padding: 5px; }

        .editor::-webkit-scrollbar  { display: block; width: 5px; }
        .editor::-webkit-scrollbar-track { background: #00000080; }
        .editor::-webkit-scrollbar-thumb { background: #282828; }
    </style>

    <script type="module" src="notas.js"></script>
    <script src="bloqueio.js"></script>
    <script src="https://kit.fontawesome.com/ac3bdc8044.js" crossorigin="anonymous"></script>
</body>
</html>
