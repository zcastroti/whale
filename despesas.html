<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale</title>    
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="ico-whale.png" type="image/x-icon">
</head>
<body>
    <main class="conteudo">
        <div class="meses">
            Carregando...
        </div>

        <div class="botoesFooter">
            <button class="btnAnoDespesas">Ano das Despesas <i class="fa-solid fa-eye"></i></button>
        </div>
    </main>

    <style>
        i { pointer-events: none; }

        .meses {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px; }

        .mes {
            display: flex;  flex-flow: column; align-items: center; gap: 5px;
            padding: 25px 30px;
            cursor: pointer;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2f0e5;
            box-shadow: 0 4px 6px -1px #0000000d, 0 2px 4px -1px #00000008; /* Sombra elegante estilo Tailwind */
            transition: all 0.2s ease-in-out; /* Transição suave para interações */
        }

        .mes:hover { 
            transform: translateY(-1px);
            background: #fbfffa;
            border-color: #d0e1cb;
            box-shadow: 0 10px 15px -3px #00000014, 0 4px 6px -2px #0000000a; }

        .botoes {
            display: flex; align-items: center; justify-content: flex-end;
        }


        .containerDespesas {
            max-height: 450px;
            overflow-y: scroll;
            grid-column: span 5;
            display: flex;
            flex-flow: column;
            gap: 5px;
            padding: 5px;
            border-radius: 8px 0px 0px 8px;
            border: 1px solid #cccccc; 
            box-shadow: 0 4px 6px -1px #0000000d, 0 2px 4px -1px #00000008;
        }

        .containerDespesas::-webkit-scrollbar  { display: block; width: 5px; }
        .containerDespesas::-webkit-scrollbar-track { background: #00000080; }
        .containerDespesas::-webkit-scrollbar-thumb { background: #6980ab; }
        .containerDespesas::-webkit-scrollbar-thumb { background: #6980ab; }

        .containerTotalizacao {
            grid-column: span 5;
            display: flex;
            flex-flow: column;
            gap: 5px;
            padding: 5px;
        }

        .item { 
            padding: 5px;
            background: linear-gradient(90deg, #ededed, #f4f4f4); }

        @media screen and (max-width: 750px) { 
            .meses { grid-template-columns: repeat(3, 1fr); }
        }

        @media screen and (max-width: 600px) { 
            .meses { grid-template-columns: repeat(2, 1fr); padding-bottom: 120px; }
        }

        @media screen and (max-width: 750px) { 
            .containerDespesas,
            .containerTotalizacao {
                grid-column: span 10;
            }
        }

    </style>

    <script type="module" src="despesas.js"></script>
    <script src="bloqueio.js"></script>
    <script src="https://kit.fontawesome.com/ac3bdc8044.js" crossorigin="anonymous"></script>
</body>
</html>
