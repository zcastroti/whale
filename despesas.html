<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale</title>    
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="ico-whale.png" type="image/x-icon">
</head>
<body>
    <main class="conteudo">
    </main>

    

    <style>
        i { pointer-events: none; }

        .meses {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px; }

        .mes {
            display: flex;  flex-flow: column; align-items: center; gap: 5px;
            padding: 25px 30px;
            cursor: pointer;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2f0e5;
            box-shadow: 0 4px 6px -1px #0000000d, 0 2px 4px -1px #00000008; /* Sombra elegante estilo Tailwind */
            transition: all 0.2s ease-in-out; /* Transição suave para interações */
        }

        .mes:hover { 
            transform: translateY(-1px);
            background: #fbfffa;
            border-color: #d0e1cb;
            box-shadow: 0 10px 15px -3px #00000014, 0 4px 6px -2px #0000000a; }

        .col-acao { width: 60px; }
        .col-parcela { width: 80px; text-align: center; }
        .col-vencimento { width: 80px; text-align: center; }
        .col-valor { width: 120px; text-align: right; }


        .botoes {
            display: flex; align-items: center; justify-content: flex-end;
        }

        @media screen and (max-width: 750px) {
            .meses { grid-template-columns: repeat(3, 1fr); }
        }

        @media screen and (max-width: 600px) { 
            .meses { 
                grid-template-columns: repeat(2, 1fr);
                padding-bottom: 30px; }

            .col-parcela { display: none; }
            .col-vencimento { display: none; }
        }
    </style>

    <script type="module" src="despesas.js"></script>
    <script src="bloqueio.js"></script>
    <script src="https://kit.fontawesome.com/ac3bdc8044.js" crossorigin="anonymous"></script>
</body>
</html>
